name: Fork build

# Builds an unsigned prerelease APK on every push to the fork.
# Version = upstream versionName + "." + (number of fork commits since fork-base.txt).
# Example: upstream 4.8.0, one fork commit -> 4.8.0.1. Right after an upstream sync -> 4.8.0.

on:
  push:
    branches: [ fork-main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compute fork version
        id: version
        run: |
          BASE_SHA=$(tr -d '[:space:]' < fork-base.txt)
          BASE_VERSION=$(grep -m1 '^versionName' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          N=$(git rev-list --count "${BASE_SHA}..HEAD")
          if [ "$N" -eq 0 ]; then V="$BASE_VERSION"; else V="$BASE_VERSION.$N"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Fork version: $V"

      - name: Apply fork version (build only, not committed)
        run: |
          sed -i 's/^versionName = .*/versionName = "${{ steps.version.outputs.version }}"/' gradle/libs.versions.toml

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/work/_temp/keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/work/_temp/keystore/fork.jks"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: APK will be unsigned"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build prerelease APK
        run: |
          chmod +x gradlew
          ./gradlew assemblePrereleaseRelease

      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/prerelease/release/*.apk

      - name: Publish release (signed builds only)
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          APK="cloudstream-$V.apk"
          cp app/build/outputs/apk/prerelease/release/*.apk "$APK"
          gh release create "v$V" "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "CloudStream $V" \
            --notes "Fork build $V (signed with the fork key). Commit: $GITHUB_SHA" \
          || gh release upload "v$V" "$APK" --clobber

      - name: Move pre-release tag to this commit (used by the in-app updater)
        if: env.SIGNED == 'true'
        run: |
          git tag -f pre-release "$GITHUB_SHA"
          git push -f origin refs/tags/pre-release
